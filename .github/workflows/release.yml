name: Release

on:
  push:
    tags: ["v*"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish tagged npm release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate tag and package identity
        id: release
        shell: bash
        run: |
          set -Eeuo pipefail
          version="$(node scripts/apex/validate-release-tag.mjs "${GITHUB_REF_NAME}")"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Mirrors ci.yml's own Linux system-dependencies step (canvas/image libs,
      # fd/ripgrep, and bubblewrap for OS sandbox enforcement). This step had
      # drifted to installing only fd-find/ripgrep, so every real Test run here
      # failed on every OS-sandbox-enforcing test with "Bubblewrap (bwrap) is
      # required for OS sandboxing" -- discovered running the actual v0.0.1-alpha.2
      # release (task 12.15); ci.yml itself never caught this because ci.yml has
      # its own separate, already-correct copy of this step.
      - name: System dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev \
            libgif-dev librsvg2-dev fd-find ripgrep bubblewrap
          sudo ln -s "$(command -v fdfind)" /usr/local/bin/fd
          # See ci.yml's identical step for why this is required on Ubuntu 24.04
          # runner images (docs/plans/2026-08-12-os-sandbox.md, task 2b.7).
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install
        run: npm ci --ignore-scripts

      - name: Check frozen package boundary
        run: node scripts/apex/check-frozen-packages.mjs

      # ADR 0018 (task 12.11): a release does not ship a production dependency
      # with a known high/critical vulnerability, even one already present
      # before this release's own changes. --omit=dev: a vulnerable dev-only
      # tool (a linter, a test runner) never reaches an end user's install and
      # is not a release blocker on its own.
      - name: Production dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

      - name: Check
        run: npm run check

      - name: Test
        run: npm test

      # `scripts/build-binaries.sh` is the already-established sole producer of
      # portable archive layouts. Build and verify them before either npm
      # publication, but do not create a public GitHub Release until the npm
      # provenance gate and the separate macOS verification job have both passed.
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: 1.3.14

      - name: Build standalone binary archives
        shell: bash
        run: ./scripts/build-binaries.sh --skip-install --skip-build --out "${RUNNER_TEMP}/binaries"

      - name: Generate standalone archive checksums
        shell: bash
        run: node scripts/apex/prepare-binary-release.mjs "${RUNNER_TEMP}/binaries"

      - name: Smoke test local standalone binary
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -Eeuo pipefail
          [[ "$("${RUNNER_TEMP}/binaries/linux-x64/apex-code" --version)" == "${VERSION}" ]]

      # Preserve the exact bytes that passed the pre-publication build and
      # smoke gate. The final job below is deliberately the only job with
      # contents: write, and consumes this immutable workflow artifact only
      # after the macOS registry-install gate succeeds.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: standalone-release-assets
          path: |
            ${{ runner.temp }}/binaries/apex-code-*.tar.gz
            ${{ runner.temp }}/binaries/apex-code-*.zip
            ${{ runner.temp }}/binaries/SHA256SUMS
          if-no-files-found: error

      # ADR 0018 (task 12.8): a dry-run pack only proves the tarball builds, not
      # that its packed contents are what the maintainer believes they are --
      # the concrete trigger for this phase was exactly a tarball that packed
      # successfully but shipped stale Pi-branded content. This packs both
      # Apex-owned tarballs for real, inspects their packed README/dist/metadata
      # against a reviewed allowlist, then installs them into an isolated
      # scratch directory and runs a real, provider-independent scripted turn
      # through the real sandbox -- before either package is published.
      - name: Packed-artifact identity and functional smoke gate
        run: node scripts/apex/packed-product-surface.mjs --out "${RUNNER_TEMP}/packed-product-surface" --smoke

      # Scoped to the packed-and-installed production dependency graph (the
      # scratch install the smoke gate above just created), not this monorepo's
      # own root node_modules -- which also contains devDependencies (biome,
      # vitest, tsx, ...) no end user's install ever receives. "Complete
      # transitive production dependency license closure" means what actually
      # ships, not everything this repository happens to have installed.
      - name: Generate third-party license report
        run: npm run generate:license-report -- --node-modules "${RUNNER_TEMP}/packed-product-surface/smoke-install/node_modules"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: third-party-licenses
          path: .artifacts/third-party-licenses.md
          if-no-files-found: error
          # .artifacts/ is dot-prefixed ("hidden"); see the sbom upload step
          # below for why every upload from it needs this set.
          include-hidden-files: true

      - name: Generate SBOM
        run: node scripts/apex/generate-sbom.mjs

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: .artifacts/sbom-*.cyclonedx.json
          if-no-files-found: error
          # actions/upload-artifact defaults to excluding dot-prefixed ("hidden")
          # path segments during its glob search, and .artifacts/ is one -- this
          # wildcarded pattern silently matched zero files because of it
          # (confirmed live running the real v0.0.1-alpha.2 release -- task
          # 12.15 -- and by reproducing search.ts's own getDefaultGlobOptions()
          # locally: excludeHiddenFiles defaults to true unless this is set).
          # The literal-filename uploads elsewhere in this workflow happened to
          # still work without it, since a literal path bypasses glob expansion
          # entirely, but that is coincidental, not guaranteed -- so this is set
          # on every .artifacts/-sourced upload in this workflow, not just here.
          include-hidden-files: true

      # The core is an exact dependency of the CLI, so it must become visible
      # in the registry before apex-code is published.
      - name: Publish Apex Code agent core
        working-directory: packages/agent
        run: npm publish --access public --provenance --tag next --ignore-scripts

      - name: Wait for agent core registry visibility
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -Eeuo pipefail
          for attempt in {1..30}; do
            if [[ "$(npm view "apex-code-agent-core@${VERSION}" version 2>/dev/null || true)" == "${VERSION}" ]]; then
              exit 0
            fi
            if [[ "${attempt}" == 30 ]]; then
              echo "apex-code-agent-core@${VERSION} did not become visible within five minutes" >&2
              exit 1
            fi
            sleep 10
          done

      - name: Publish Apex Code CLI
        working-directory: packages/coding-agent
        run: npm publish --access public --provenance --tag next --ignore-scripts

      - name: Verify clean registry install
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -Eeuo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf -- "$scratch"' EXIT
          cd "$scratch"
          npm init --yes >/dev/null
          # A newly published version can reach different registry/CDN edges at
          # different times. Use a fresh cache on every attempt so npm does not
          # retain an early ETARGET response, and allow up to ten minutes.
          for attempt in {1..60}; do
            rm -rf -- "$scratch/npm-cache"
            if npm install --global --prefix "$scratch/global" --cache "$scratch/npm-cache" --prefer-online --ignore-scripts "apex-code@${VERSION}"; then
              break
            fi
            if [[ "${attempt}" == 60 ]]; then
              echo "apex-code@${VERSION} did not install within ten minutes" >&2
              exit 1
            fi
            sleep 10
          done
          [[ "$("$scratch/global/bin/apex-code" --version)" == "${VERSION}" ]]

      # ADR 0018 (task 12.9): "the install printed the right --version string"
      # is not release evidence -- it does not prove the registry actually
      # distributed the commit CI built and published. This compares the
      # registry's own gitHead against the tag commit, re-downloads and
      # rehashes each published tarball against the registry's own reported
      # digests, and confirms npm provenance is attached.
      - name: Verify registry gitHead, tarball hash, and provenance
        shell: bash
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          set -Eeuo pipefail
          node scripts/apex/verify-published-release.mjs \
            "apex-code-agent-core@${VERSION}" "apex-code@${VERSION}" \
            --git-head "${GITHUB_SHA}" \
            --manifest-out .artifacts/release-evidence.json

      # Durable, retrievable release evidence (ADR 0018, task 12.11): the exact
      # gitHead, tarball hash, and provenance attestation URL the registry
      # reported for this release, independent of the workflow log.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-evidence
          path: .artifacts/release-evidence.json
          if-no-files-found: error
          # .artifacts/ is dot-prefixed ("hidden"); see the sbom upload step
          # above for why every upload from it needs this set.
          include-hidden-files: true

  # ADR 0005: Linux and macOS are the supported platforms (Windows is a standing
  # exclusion, not reopened here). The Ubuntu job above builds, tests, and
  # publishes; this job only verifies the already-published artifact installs
  # and runs on the other supported platform -- it must never re-run the
  # publish steps, or the release would be published twice.
  verify-macos-install:
    name: Verify clean install on macOS
    runs-on: macos-latest
    needs: publish
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify clean registry install
        shell: bash
        env:
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -Eeuo pipefail
          scratch="$(mktemp -d)"
          trap 'rm -rf -- "$scratch"' EXIT
          cd "$scratch"
          npm init --yes >/dev/null
          # Same registry-propagation retry as the Ubuntu job: a fresh cache on
          # every attempt so npm does not retain an early ETARGET response.
          for attempt in {1..60}; do
            rm -rf -- "$scratch/npm-cache"
            if npm install --global --prefix "$scratch/global" --cache "$scratch/npm-cache" --prefer-online --ignore-scripts "apex-code@${VERSION}"; then
              break
            fi
            if [[ "${attempt}" == 60 ]]; then
              echo "apex-code@${VERSION} did not install within ten minutes" >&2
              exit 1
            fi
            sleep 10
          done
          [[ "$("$scratch/global/bin/apex-code" --version)" == "${VERSION}" ]]

  # This job is intentionally separate from npm Trusted Publishing. It gets
  # only GitHub-release authority, waits for both the complete npm/provenance
  # path and the macOS clean-install gate, and uploads the exact pre-publication
  # archive bytes preserved by the publish job above.
  publish-binaries:
    name: Publish standalone GitHub Release assets
    runs-on: ubuntu-latest
    needs: [publish, verify-macos-install]
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: standalone-release-assets
          path: release-assets

      - name: Create GitHub Release with verified standalone archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -Eeuo pipefail
          test -s release-assets/SHA256SUMS
          gh release create "${GITHUB_REF_NAME}" \
            --title "Apex Code v${VERSION}" \
            --generate-notes \
            release-assets/SHA256SUMS \
            release-assets/apex-code-*.tar.gz \
            release-assets/apex-code-*.zip
