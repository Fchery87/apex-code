# THROWAWAY diagnostic workflow. Investigates why `bwrap --unshare-net` fails
# with "loopback: Failed RTM_NEWADDR: Operation not permitted" on GitHub's
# hosted ubuntu-latest runners (see docs/plans/2026-08-12-os-sandbox.md's
# "Known, separate gap" note under 2b.5). Deleted once findings are folded
# into the spec/plan/ADR. Not part of the real CI matrix.
name: linux-bwrap-netns-spike

on:
  workflow_dispatch: {}

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Kernel / distro identification
        run: |
          uname -a
          cat /etc/os-release
          cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo "no unprivileged_userns_clone sysctl"
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null || echo "no apparmor_restrict_unprivileged_userns sysctl"
          sudo aa-status 2>/dev/null || echo "aa-status not available or failed"

      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          bwrap --version

      - name: Reproduce the failure (baseline, no fix)
        continue-on-error: true
        run: |
          set -x
          bwrap --unshare-net --dev-bind / / -- /bin/true
          echo "exit=$?"

      - name: Check whether an unprivileged user namespace can be created at all
        continue-on-error: true
        run: |
          set -x
          unshare --user --map-root-user --net -- /bin/true
          echo "exit=$?"

      - name: Try the documented AppArmor userns-restriction fix
        continue-on-error: true
        run: |
          set -x
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || echo "sysctl set failed"
          cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns 2>/dev/null

      - name: Retry bwrap after the sysctl fix
        continue-on-error: true
        run: |
          set -x
          bwrap --unshare-net --dev-bind / / -- /bin/true
          echo "exit=$?"

      - name: If still failing, try an explicit AppArmor unconfined profile for bwrap
        continue-on-error: true
        run: |
          set -x
          which bwrap
          sudo aa-status 2>/dev/null | grep -i bwrap || echo "no bwrap-specific apparmor profile listed"

      - name: Run this repo's actual Linux sandbox test suite (if bwrap now works)
        continue-on-error: true
        run: |
          set -x
          bwrap --unshare-net --dev-bind / / -- /bin/true && echo "BWRAP_WORKS=1" >> "$GITHUB_ENV" || echo "BWRAP_WORKS=0" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        if: always()

      - uses: actions/setup-node@v4
        if: always()
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        if: always()
        run: npm ci --ignore-scripts

      - name: Build
        if: always()
        run: npm run build

      - name: Run sandbox test suite only
        if: always()
        continue-on-error: true
        run: npx vitest run packages/coding-agent/test/sandbox --reporter=verbose
