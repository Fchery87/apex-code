name: Refresh model data

# Builds restore the model catalogs from vendor/model-data and never call
# models.dev, so nothing keeps that snapshot current any more. This job is what
# replaces the freshness the old build-time fetch provided, with the difference
# that a catalog change now arrives as a reviewable PR that CI has tested on all
# three OSes, instead of changing silently under every build.
on:
  schedule:
    # Weekly, matching the cadence dependabot already uses for this repo.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: refresh-model-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    name: Refresh vendored model catalogs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22

      - run: npm ci --ignore-scripts

      # Fails the job when models.dev is unreachable, after the wrapper's own
      # retries. A red scheduled run is the signal; the snapshot in main is
      # untouched and builds keep working from it.
      - run: npm run refresh:model-data

      # A PR opened by GITHUB_TOKEN does not start CI on its own; GitHub gates
      # the run as action_required so workflows cannot trigger each other in a
      # loop. So prove the refreshed snapshot builds before proposing it, rather
      # than opening a PR whose only check is one a human has to unlock. This
      # runs check:model-data, which is the failure specific to a refresh: a
      # provider set that no longer matches the frozen .models.ts shards.
      - run: npm run build

      - name: Open or update the refresh PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: chore/refresh-model-data
        run: |
          set -Eeuo pipefail

          # Every refresh rewrites .manifest.json, because it records when it ran.
          # Judging change by it would open an empty PR every week and teach
          # everyone to ignore these, so only provider files count.
          changed_files="$(git diff --name-only -- vendor/model-data | grep -v '/\.manifest\.json$' || true)"
          if [ -z "$changed_files" ]; then
            git checkout -- vendor/model-data
            echo "Provider catalogs unchanged; only the refresh timestamp moved. Nothing to open."
            exit 0
          fi

          generated_at="$(node -p 'require("./vendor/model-data/.manifest.json").generatedAt')"
          changed="$(echo "$changed_files" | sed 's|vendor/model-data/||' | sed 's|\.json$||' | paste -sd, | sed 's/,/, /g')"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The branch is reset from this run's main every time, so its history is
          # never a base anyone builds on and a plain force-push is the intent.
          git switch -C "$BRANCH"
          git add vendor/model-data
          git commit -m "chore(model-data): refresh vendored catalogs" \
            -m "Captured from models.dev at ${generated_at}." \
            -m "Providers changed: ${changed}."
          git push --force origin "$BRANCH"

          if gh pr view "$BRANCH" --json number --jq .number >/dev/null 2>&1; then
            echo "Existing PR updated by the force-push."
            exit 0
          fi

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(model-data): refresh vendored catalogs" \
            --body "$(printf 'Captured from models.dev at %s.\n\nProviders changed: %s.\n\nBuilds restore these files from `vendor/model-data`, so this PR is how a catalog change reaches users.\n\nThe refresh job already built this snapshot, which is what runs `check:model-data` against the frozen `.models.ts` shards. GitHub gates CI on PRs it opens itself, so approve the pending run to get the full suite on all three OSes before merging.\n' "$generated_at" "$changed")"
